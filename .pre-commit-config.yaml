fail_fast: false
repos:
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: clang-format
        args: [-i]
      - id: clang-tidy
        # tests/host/ builds with the host's own g++/clang++ (see
        # tests/host/Makefile) and is never compiled by the ARM
        # toolchain, so it has no entry in compile_commands.json.
        # Without a matching compile command, clang-tidy falls back to
        # this repo's .clang-tidy ExtraArgsBefore standalone (-std=c++23
        # plus --target=arm-none-eabi/--sysroot=devkitARM/-I<butano
        # paths>), which don't apply to host-only code and made clang's
        # driver misdetect the .h files as C in the process (invalid
        # argument '-std=c++23' not allowed with 'C'). clang-format
        # still runs here - formatting is language/target-agnostic.
        exclude: ^tests/

  - repo: local
    hooks:
      - id: check-level-hints
        name: Validate LevelData::intro_hint strings
        description: >-
          Hints must be <= hint::MAX_CHARS printable ASCII characters - see
          tools/Check_level_hints.py.
        entry: python3 tools/Check_level_hints.py
        language: system
        files: ^(game/include/level/levels_world.*\.h|game/include/hint_logic\.h|tools/Check_level_hints\.py)$
        pass_filenames: false
      - id: check-world-index
        name: Validate WorldIndex against levels[]
        description: >-
          world_index.h's WORLDS table must cover main.cpp's levels[] exactly
          - see tools/Check_world_index.py.
        entry: python3 tools/Check_world_index.py
        language: system
        files: ^(game/src/main\.cpp|game/include/world_index\.h|tools/Check_world_index\.py)$
        pass_filenames: false
      - id: check-trigger-references
        name: Validate trigger_name references
        description: >-
          Every TrapData::trigger_name must resolve to a TriggerData::name
          defined for that same level - see tools/Check_trigger_references.py.
        entry: python3 tools/Check_trigger_references.py
        language: system
        # Full scan every time it runs (not per changed file), triggered
        # whenever level data or the checker script itself changes.
        files: ^(game/include/level/levels_world.*\.h|tools/Check_trigger_references\.py)$
        pass_filenames: false
      - id: check-sprite-budget
        name: Validate sprite and entity budgets
        description: >-
          Levels must stay inside Cfg::Level::Limits, the SpriteRegistry
          capacity and the 128 hardware sprites - see
          tools/Check_sprite_budget.py.
        entry: python3 tools/Check_sprite_budget.py
        language: system
        files: ^(game/include/level/levels_world.*\.h|game/include/cfg\.h|game/include/pause_controller\.h|extern/engine/core/include/(sprite|collision)_registry\.h|tools/Check_sprite_budget\.py)$
        pass_filenames: false
      - id: check-level-reachability
        name: Validate that every level can be finished
        description: >-
          Every door must be reachable with the abilities of its level (the
          dash only from Cfg::Dash::UNLOCK_WORLD on) - see
          tools/Check_level_reachability.py.
        entry: python3 tools/Check_level_reachability.py --all
        language: system
        files: ^(game/include/level/levels_world.*\.h|game/src/main\.cpp|game/include/world_index\.h|game/include/cfg(_dash)?\.h|tools/Check_level_reachability\.py)$
        pass_filenames: false
      - id: check-hitboxes
        name: Validate hitboxes against their pictures
        description: >-
          Platform and trap collision boxes must match the opaque pixels of
          their sprites - see tools/Check_hitboxes.py.
        entry: python3 tools/Check_hitboxes.py
        language: system
        files: ^(game/include/level/levels.*\.h|game/include/cfg\.h|game/graphics/.*\.(bmp|json)|tools/Check_hitboxes\.py)$
        pass_filenames: false
      - id: host-tests
        name: Host unit tests
        description: >-
          Builds (incrementally) and runs tests/host whenever game headers or
          the tests change - see tests/host/Makefile.
        entry: make -C tests/host
        language: system
        files: ^(game/include/.*\.h|tests/host/.*|extern/engine/src/save_system/.*)$
        pass_filenames: false
      - id: generated-levels
        name: Level headers match game/levels/*.json
        description: >-
          game/include/level/levels_world*.h are generated from
          game/levels/world*.json - edit the JSON and run
          python3 tools/Generate_levels.py.
        entry: python3 tools/Generate_levels.py --check
        language: system
        files: ^(game/levels/.*\.json|game/include/level/levels_world.*\.h|game/include/level/level_structure\.h|tools/Generate_levels\.py)$
        pass_filenames: false
