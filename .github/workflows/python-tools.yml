name: Python tools

# Runs the repository's Python tooling on its own: the unit tests under tools/
# (level-data checkers, jump/dash reachability simulator, sprite and sound
# generators) and the level-data checks themselves. No Docker or ARM toolchain
# needed, so it stays fast and independent of the GBA build.

on:
  push:
  pull_request:

jobs:
  python-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Only extern/engine itself (not its nested Butano submodule): the
          # sprite budget check reads the SpriteRegistry / CollisionRegistry
          # capacities from its headers instead of assuming them.
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests (tools/test_*.py)
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      # Every level data checker (see the root Makefile's `checks` target):
      # trigger references, hints, world index, checkpoints, budgets,
      # hitboxes and that every level can be finished.
      - name: Level data checks
        run: make checks

      # One picture per level (platforms by reachability, traps, triggers,
      # jump arcs) to look at in the run's artifacts; plain jumps only to keep
      # the step short.
      - name: Level previews
        run: python3 tools/Preview_level.py --arcs plain --out-dir build/level_preview

      - uses: actions/upload-artifact@v4
        with:
          name: level-previews
          path: build/level_preview/
