name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Only extern/engine itself is needed here (pure save-system
          # headers) - not its own nested butano submodule, which the
          # host tests never touch.
          submodules: true

      - name: Build and run tests/host
        run: |
          cd tests/host
          make

  level-data-checks:
    name: Level data checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No submodules needed - this only reads game/include/level/.

      - name: Validate trigger_name references
        run: python3 tools/Check_trigger_references.py

  gba-build:
    name: GBA build + headless boot
    runs-on: ubuntu-latest
    # TEMPORARY: pkg.devkitpro.org has returned 403 on GitHub-hosted
    # runners (see docker/Dockerfile's retry loop around dkp-pacman).
    # continue-on-error keeps this job's failure from blocking the whole
    # workflow/PR checks while that's investigated, without hiding it -
    # the job still shows as failed (yellow "!"), just non-blocking.
    # Remove this once a build has gone green on GitHub Actions, or once
    # the fix (retry, or switching to devkitPro's prebuilt CI image) is
    # confirmed to work reliably there.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The image is fully determined by docker/Dockerfile alone (repo
      # source is bind-mounted at `docker run` time below, never baked
      # into the image), so it's cacheable as one unit keyed by that
      # file's hash - skips the devkitPro/mGBA/LLVM install entirely on
      # every run where the Dockerfile hasn't changed. Bump the "v1"
      # prefix to force a one-off cache invalidation if ever needed
      # (e.g. a corrupted cache entry) without touching the Dockerfile.
      - name: Restore cached image
        id: image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/projectgba-image.tar
          key: docker-image-v1-${{ hashFiles('docker/Dockerfile') }}

      - name: Load cached image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/projectgba-image.tar

      - name: Build dev container image
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: docker build -t projectgba -f docker/Dockerfile .

      - name: Save image to cache
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: docker save projectgba -o /tmp/projectgba-image.tar

      # --user matches the container process's UID/GID to the runner's own
      # (whatever checked out the repo), so the bind-mounted /workspace is
      # writable regardless of the image's baked-in `ubuntu` user's UID.
      # Locally, VS Code's Dev Containers extension does the equivalent via
      # devcontainer.json's updateRemoteUserUID; a raw `docker run` has no
      # equivalent, so this is CI's explicit stand-in for that.
      - name: Build ROM
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            projectgba bash -c "make"

      - name: Headless boot test
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            projectgba bash -c "./test-rom.sh platformer.gba"